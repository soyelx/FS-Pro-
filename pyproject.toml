[project]
name = "sf-pro-fonts-tooling"
version = "1.0.0"
description = "Validation and manifest tooling for the SF Pro font collection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (tooling and docs only; fonts are licensed by Apple, see NOTICE.md)" }

[project.optional-dependencies]
dev = ["fonttools>=4.47", "pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
